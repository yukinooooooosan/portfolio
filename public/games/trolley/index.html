<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* =========================================================
   定数
   ========================================================= */
const DT = 1 / 120;          // 固定タイムステップ
const FIRST_GAP = 60, RETRY_GAP = 30;   // スタート地点から分岐の先端までの距離（初回／2回目以降）
const TONGUE = 1.0;          // トングレールの長さ
const WHEELBASE = 3.0;       // 前輪と後輪の間隔
const CAR_GAP = 1.4;         // 連結した前の車両の後輪から、次の車両の前輪まで
const BAND_LO = 0.15, BAND_HI = 0.85;  // これより内側は「中途半端」
const SPEED = 12;            // 走行速度 m/s
const BODY_Y = 0.65;         // 車体中心の高さ
const BODY_HALF = [0.7, 0.35, 1.8];
const BALL_R = 0.28;
const BALL_LOCAL = [[-0.32, -0.75], [0.32, -0.75], [-0.32, 0.05], [0.32, 0.05], [0, 0.85]];

// 猫と犬：小さな模型（base）を scale 倍して、人と同じくらいの背丈にする。half は当たり判定の箱
const ANIMAL = {
  cat: { base: [0.12, 0.16, 0.26], scale: 5, mass: 20, name: '猫', unit: '匹' },
  dog: { base: [0.16, 0.24, 0.36], scale: 3.3, mass: 25, name: '犬', unit: '匹' },
};
for (const a of Object.values(ANIMAL)) a.half = a.base.map(v => v * a.scale);
const REASON_LABEL = {
  climb: '乗り上がり脱線',
  'rear-climb': '後輪 乗り上がり',
  shove: '割り込み脱線',
  drift: 'マルチトラックドリフト',
  overturn: '転覆',
  split: '泣き別れ',
};

/* =========================================================
   線路
   ========================================================= */
function makePath(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const len = cum[cum.length - 1];
  function sample(s) {
    s = Math.max(0, Math.min(len, s));
    let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
    const segLen = (cum[hi] - cum[lo]) || 1e-9, t = (s - cum[lo]) / segLen;
    const [ax, az] = pts[lo], [bx, bz] = pts[hi];
    return { x: ax + (bx - ax) * t, z: az + (bz - az) * t, tx: (bx - ax) / segLen, tz: (bz - az) / segLen };
  }
  return { pts, len, sample };
}
const bez = (a, b, c, d, t) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };
function branchPts(sign) {
  const X = 3.2 * sign, pts = [];
  for (let i = 0; i <= 80; i++) { const t = i / 80; pts.push([bez(0, 0, X, X, t), bez(0, -6, -10, -16, t)]); }
  for (let z = -18; z >= -90; z -= 2) pts.push([X, z]);
  return pts;
}
// 現在のステージの線路（ステージを切り替えると差し替わる）
let LS, PATHS, STAGE;

/* 分岐器の形（見た目用）
   2本のトングレールは転てつ棒でつながり、後端（ヒール）を支点に先端が左右に振れる。
   行きたい方向と反対側のトングレールが基本レールに密着する。中間では両側に隙間が開く。 */
const TV = 2.5;     // 見た目のトングレール長
const GAP = 0.22;   // 開いた側の隙間（実物より誇張）
function railXZ(path, s, off) { const p = path.sample(s); return { x: p.x - p.tz * off, z: p.z + p.tx * off }; }
function tongueGeom(q) {
  const rTip = { x: 0.45 - GAP * q, z: 0 }, lTip = { x: rTip.x - (0.9 - GAP), z: 0 };
  return {
    lTip, rTip,
    lHeel: railXZ(PATHS.R, TV, -0.5),   // 左のトングは反位側（右へ行く線路）の左レールにつながる
    rHeel: railXZ(PATHS.L, TV, 0.5),    // 右のトングは定位側（左へ行く線路）の右レールにつながる
    gapL: lTip.x + 0.45, gapR: 0.45 - rTip.x,
  };
}

function onTrackP(paths, seg, s, off) { const p = paths[seg].sample(s); return { x: p.x - p.tz * off, z: p.z + p.tx * off }; }

/* =========================================================
   ステージ
   ========================================================= */
// 線路に沿った岩壁：中心線から off の位置に内側の面が来るよう、厚み 0.8 の箱を並べる
function wallsAlong(path, s0, s1, off, opt = {}) {
  const out = [], step = opt.step ?? 4, th = 0.8, h = opt.h ?? 4.5, skip = opt.skip ?? [];
  const offAt = typeof off === 'function' ? off : () => off;   // 位置によって変わる幅にも対応
  const sgn = offAt(s0) < 0 ? -1 : 1;
  for (let s = s0; s < s1 - 1e-6; s += step) {
    const s2 = Math.min(s1, s + step), sm = (s + s2) / 2;
    if (skip.some(([a, b]) => sm > a && sm < b)) continue;
    const a = railXZ(path, s, offAt(s) + sgn * th / 2), b = railXZ(path, s2, offAt(s2) + sgn * th / 2);
    const dx = b.x - a.x, dz = b.z - a.z;
    out.push({ x: (a.x + b.x) / 2, z: (a.z + b.z) / 2, w: th, h, d: Math.hypot(dx, dz) + 0.2, yaw: Math.atan2(dx, dz), rock: true });
  }
  return out;
}
// 点を結んだ岩壁
function wallsPoly(pts, h = 4.5) {
  const out = [];
  for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i], dx = bx - ax, dz = bz - az;
    out.push({ x: (ax + bx) / 2, z: (az + bz) / 2, w: 0.8, h, d: Math.hypot(dx, dz) + 0.6, yaw: Math.atan2(dx, dz), rock: true });
  }
  return out;
}

function makeStage1() {
  const stemPts = []; for (let z = 75; z >= 0; z -= 1) stemPts.push([0, z]);
  const paths = { stem: makePath(stemPts), L: makePath(branchPts(-1)), R: makePath(branchPts(1)) };
  return {
    id: 1, name: 'ステージ1 基本', short: '基本', scenery: 'quarry',
    paths, LS: 75, speed: SPEED, endS: 46, railLen: 85,
    balls: BALL_LOCAL.map(([x, z]) => [x, 0, z]),
    people: [
      // 5人（定位側 = 左）と1人（反位側 = 右）。線路上の位置 s と横ずれ off で置く
      ...[[14.5, 0.3], [15.5, -0.3], [16.5, 0.25], [17.5, -0.3], [18.5, 0.2]].map(([s, off]) => onTrackP(paths, 'L', s, off)),
      onTrackP(paths, 'R', 16, 0),
    ],
    walls: [{ x: 5.4, z: -10, w: 0.5, h: 1.4, d: 10 }],
    labels: [['L', 5], ['R', 1]],
    railCam: { pos: [0, 1.5, -23], look: [0, -3] },
    portalZ: -67.9,
  };
}

/* ステージ2「洞窟」
   曲がった坑道を抜けると分岐のある広間。その先は岩の柱をはさんで二股の坑道に分かれる。
   左（定位）の坑道に5人、右（反位）の坑道の入口に1人。
   荷は山盛りで、右の急カーブでは普通に走っても上の段の球がこぼれる。 */
function makeStage2() {
  const W = 4, RR = 20, A = 55 * Math.PI / 180;
  const stem = [];
  for (let i = 0; i <= 120; i++) { const t = i / 120; stem.push([bez(-14, -14, 0, 0, t), bez(76, 52, 44, 20, t)]); }
  for (let z = 19; z >= 0; z -= 1) stem.push([0, z]);
  const L = [], R = [];
  for (let i = 0; i <= 80; i++) { const t = i / 80; L.push([bez(0, 0, -W, -W, t), bez(0, -7, -12, -20, t)]); R.push([bez(0, 0, W, W, t), bez(0, -7, -12, -20, t)]); }
  for (let z = -22; z >= -108; z -= 2) L.push([-W, z]);
  for (let i = 1; i <= 40; i++) { const a = A * i / 40; R.push([W + RR * (1 - Math.cos(a)), -20 - RR * Math.sin(a)]); }
  const ex = W + RR * (1 - Math.cos(A)), ez = -20 - RR * Math.sin(A);
  for (let d = 2; d <= 80; d += 2) R.push([ex + Math.sin(A) * d, ez - Math.cos(A) * d]);
  const paths = { stem: makePath(stem), L: makePath(L), R: makePath(R) };
  const LS2 = paths.stem.len;
  const HW = 2.6, S0 = 15, END = 100;
  // 岩の柱：分岐のすぐ先（NOSE）から尖って始まり、奥へ行くほど太くなる
  const NOSE = 8, pillarOff = s => s <= NOSE ? 1.0 : s >= 20 ? HW : 1.0 + (s - NOSE) / (20 - NOSE) * (HW - 1.0);
  const at = (seg, s, off) => { const p = railXZ(paths[seg], s, off); return [p.x, p.z]; };
  const walls = [
    // 曲がった坑道
    ...wallsAlong(paths.stem, 0, LS2 - 26, -HW), ...wallsAlong(paths.stem, 0, LS2 - 26, HW),
    // 分岐のある広間
    // 坑道を出たら左右に大きく広がり、分岐に向かってハの字に狭まる（カメラが壁に埋もれないように）。
    // 分岐を過ぎると、そのまま二股の坑道の外側の壁へ開いていく
    ...wallsPoly([at('stem', LS2 - 26, -HW - 0.4), [-8.5, 19], [-3.4, 2], at('L', S0, -HW - 0.4)]),
    ...wallsPoly([at('stem', LS2 - 26, HW + 0.4), [8.5, 19], [3.4, 2], at('R', S0, HW + 0.4)]),
    // 二股の坑道と、間の岩の柱
    ...wallsAlong(paths.L, S0, END, -HW), ...wallsAlong(paths.R, S0, END, HW),
    ...[
      ...wallsAlong(paths.L, NOSE, END, s => pillarOff(s), { step: 2 }),
      ...wallsAlong(paths.R, NOSE, END, s => -pillarOff(s), { step: 2 }),
      ...wallsPoly([at('L', NOSE, 1.4), at('R', NOSE, -1.4)]),
    ].map(w => ({ ...w, pillar: true })),   // 真ん中の岩の柱（リプレイの「レールの間」では見えなくする）
  ];
  // トロッコや球が届かない手前の坑道と、坑道の奥の壁は見た目だけ（物理の計算から外して軽くする）
  for (const wl of walls) if (wl.z > 17 || wl.z < -50) wl.phys = false;
  return {
    nose: NOSE,
    id: 2, name: 'ステージ2 洞窟', sapAxis: 2, ballMass: 5, followAfter: 6, short: '洞窟', scenery: 'cave',
    paths, LS: LS2, speed: SPEED, endS: 61, railLen: END,
    // 山盛りの荷：荷台いっぱいの下の段12個＋その上に5個
    balls: [
      ...[-1.4, -0.84, -0.28, 0.28, 0.84, 1.4].flatMap(z => [[-0.33, 0, z], [0.33, 0, z]]),
      ...[-1.12, -0.56, 0, 0.56, 1.12].map(z => [0, 0.37, z]),
    ],
    people: [
      ...[[17.5, 0.3], [18.5, -0.3], [19.5, 0.25], [20.5, -0.3], [21.5, 0.2]].map(([s, off]) => onTrackP(paths, 'L', s, off)),
      onTrackP(paths, 'R', 19.5, 0),   // 1人（5人と同じくらいの奥行き）
    ],
    walls,
    labels: [['L', 5], ['R', 1]],
    railCam: { pos: [0, 1.5, -31], look: [0, -3] },
  };
}

/* ステージ3「連結」
   2両つながったトロッコ。作業員は左右の線路が分かれた間に立っている。
   どちらへ普通に進んでも被害はないが、車両が分岐を通っている途中でバーを動かすと、
   前後の車両が別々の線路へ泣き別れし、連結器に引っ張られて間の作業員を巻き込む。 */
function makeStage3() {
  const base = makeStage1();
  // 二股を大きく広げる（速くても転覆しない、長くゆるいカーブ）
  const X = 6, branch = sign => {
    const pts = [];
    for (let i = 0; i <= 100; i++) { const t = i / 100; pts.push([bez(0, 0, X * sign, X * sign, t), bez(0, -11, -20, -34, t)]); }
    for (let z = -36; z >= -95; z -= 2) pts.push([X * sign, z]);
    return pts;
  };
  const paths = { stem: base.paths.stem, L: makePath(branch(-1)), R: makePath(branch(1)) };
  // 線路の間に、手前から1人・2人・3人・4人のピラミッド
  const people = [];
  [1, 2, 3, 4].forEach((n, row) => { for (let i = 0; i < n; i++) people.push({ x: (i - (n - 1) / 2) * 0.9, z: -10 - row * 3 }); });
  // ピラミッドより奥、左の線路に猫、右の線路に犬
  for (const [kind, seg] of [['cat', 'L'], ['dog', 'R']]) { const p = paths[seg].sample(30); people.push({ x: p.x, z: p.z, kind }); }
  return {
    ...base,
    id: 3, name: 'ステージ3 氷上', short: '氷上', cars: 2, portalZ: undefined, hybridCars: true,
    paths, speed: 15, portalX: X, carMass: 600,   // 重いトロッコ
    theme: 'ice', scenery: 'lake', friction: { trolley: 0.02, person: 0.15, ball: 0.05 },   // 凍った湖の上の氷上線路
    balls: [],   // 荷は積まない（空のトロッコ）
    people,
    walls: [],
    labels: [['mid', 10]], followAfter: 12,
    railCam: { pos: [0, 1.5, -24], look: [0, -3] },
  };
}

const STAGES = [makeStage1(), makeStage2(), makeStage3()];
function useStage(i) { STAGE = STAGES[i]; PATHS = STAGE.paths; LS = STAGE.LS; }
useStage(0);

/* =========================================================
   シミュレーション（描画から独立。ヘッドレスでも動く）
   ========================================================= */
class Sim {
  constructor(stage, opt = {}) {
    this.stage = stage;
    this.headless = !!opt.headless;
    this.t = 0; this.state = 'rail'; this.reason = null;
    const gap = opt.startGap ?? 30;
    this.front = { seg: 'stem', s: LS - gap };
    this.rear = { seg: 'stem', s: LS - gap - WHEELBASE };
    this.p = opt.p0 ?? 0; this.q = this.p; this.qv = 0;
    this.speed = stage.speed ?? SPEED;
    this.marks = { front: null, rear: null };
    this.leverMoved = false;
    this.hits = new Map();
    this.wallTouched = false;
    this.derailT = 0; this.endT = 0;
    this.prevYaw = null; this.yawRate = 0; this.latA = 0;
    this.events = []; this.pendingFling = [];
    this.balls = [];
    this.buildWorld();
    this.updatePose(0);
    const tb = this.trolleyBody;
    tb.position.set(this.pose.x, BODY_Y, this.pose.z);
    tb.quaternion.setFromEuler(0, this.pose.yaw, 0);
    const v0 = new CANNON.Vec3(this.pose.dir.x * this.speed, 0, this.pose.dir.z * this.speed);
    tb.velocity.copy(v0);
    // 球の積荷：最初から物理で荷台に載せておく（カーブで転がり、振られれば落ちる）
    this.balls = this.stage.balls.map(([lx, ly, lz]) => {
      const p = this.localToWorld(lx, lz);
      const b = new CANNON.Body({ mass: this.stage.ballMass ?? 12, material: this.mats.mB, linearDamping: 0.01, angularDamping: 0.25 });
      b.addShape(new CANNON.Sphere(BALL_R));
      b.position.set(p.x, BODY_Y + BODY_HALF[1] + BALL_R + 0.005 + ly, p.z);
      b.velocity.copy(v0); b.isBall = true; b.allowSleep = false;
      b.addEventListener('collide', e => {
        if (!e.body.isGround) return;
        const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
        if (v > 2.2) this.events.push({ type: 'ballImpact', v, x: b.position.x, y: 0.05, z: b.position.z });
      });
      this.world.addBody(b); return b;
    });
    // 2両目以降（連結トロッコ）。前の車両の後ろに CAR_GAP をあけてつなぐ
    this.cars = [];
    let prevRear = this.rear;
    for (let j = 1; j < (stage.cars ?? 1); j++) {
      const front = { seg: 'stem', s: prevRear.s - CAR_GAP }, rear = { seg: 'stem', s: front.s - WHEELBASE };
      const body = this.makeCarBody(); this.world.addBody(body);
      const car = { front, rear, body, pose: this.poseOf(front, rear) };
      body.position.set(car.pose.x, BODY_Y, car.pose.z); body.quaternion.setFromEuler(0, car.pose.yaw, 0);
      const v = new CANNON.Vec3(car.pose.dir.x * this.speed, 0, car.pose.dir.z * this.speed); body.velocity.copy(v);
      for (const [lx, ly, lz] of this.stage.balls) {
        const p = this.localToWorld(lx, lz, car.pose);
        const b = new CANNON.Body({ mass: this.stage.ballMass ?? 12, material: this.mats.mB, linearDamping: 0.01, angularDamping: 0.25 });
        b.addShape(new CANNON.Sphere(BALL_R));
        b.position.set(p.x, BODY_Y + BODY_HALF[1] + BALL_R + 0.005 + ly, p.z);
        b.velocity.copy(v); b.isBall = true; b.allowSleep = false;
        this.world.addBody(b); this.balls.push(b);
      }
      this.cars.push(car); prevRear = rear;
    }
  }

  // 一番後ろの車輪
  get tail() { return this.cars.length ? this.cars[this.cars.length - 1].rear : this.rear; }
  get bodies() { return [this.trolleyBody, ...this.cars.map(c => c.body)]; }

  // 車両1両分の物体（走行中はキネマティック）
  makeCarBody() {
    const tb = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, material: this.mats.mT, linearDamping: 0, angularDamping: 0.03 });
    tb.addShape(new CANNON.Box(new CANNON.Vec3(...BODY_HALF)));          // 車体（荷台の床）
    const wh = 0.225, wy = BODY_HALF[1] + wh;                              // 荷台の壁（高さ0.45）
    tb.addShape(new CANNON.Box(new CANNON.Vec3(0.05, wh, 1.8)), new CANNON.Vec3(-0.7, wy, 0));
    tb.addShape(new CANNON.Box(new CANNON.Vec3(0.05, wh, 1.8)), new CANNON.Vec3(0.7, wy, 0));
    tb.addShape(new CANNON.Box(new CANNON.Vec3(0.7, wh, 0.05)), new CANNON.Vec3(0, wy, -1.75));
    tb.addShape(new CANNON.Box(new CANNON.Vec3(0.7, wh, 0.05)), new CANNON.Vec3(0, wy, 1.75));
    tb.isTrolley = true; tb.allowSleep = false;
    tb.addEventListener('collide', e => this.onTrolleyContact(e, tb));
    return tb;
  }

  // 前輪・後輪の位置から車体の位置と向き
  poseOf(front, rear) {
    const F = this.axlePos(front), R = this.axlePos(rear);
    const dx = F.x - R.x, dz = F.z - R.z, d = Math.hypot(dx, dz) || 1;
    const dir = { x: dx / d, z: dz / d };
    return { x: (F.x + R.x) / 2, z: (F.z + R.z) / 2, yaw: Math.atan2(-dir.x, -dir.z), dir, F, R, axleDist: d };
  }
  // キネマティックな車体を、次のステップで pose の位置・向きになるよう動かす
  drive(body, pose, dt) {
    if (dt <= 0) return;
    body.velocity.set((pose.x - body.position.x) / dt, 0, (pose.z - body.position.z) / dt);
    const f = body.quaternion.vmult(new CANNON.Vec3(0, 0, -1));
    let dyw = pose.yaw - Math.atan2(-f.x, -f.z); dyw = Math.atan2(Math.sin(dyw), Math.cos(dyw));
    body.angularVelocity.set(0, dyw / dt, 0);
  }
  // 2両目以降を進める。脱線条件に当たったら理由を返す
  moveCars(ds, dt, checks) {
    let prev = { rearPose: this.pose, rear: this.rear };
    for (const car of this.cars) {
      if (checks) {
        let r = this.advance(car.front, ds, null); if (r) return { ...r, reason: 'rear-climb' };
        r = this.advance(car.rear, ds, null); if (r) return { ...r, reason: 'rear-climb' };
        // 車輪の下でトングレールが動いたら、その車輪は反対側の線路へ押し出される（泣き別れの起き方）
        for (const a of [car.front, car.rear]) if (a.seg !== 'stem' && a.s < TONGUE && ((a.seg === 'L' && this.q > 0.5) || (a.seg === 'R' && this.q < 0.5))) {
          a.seg = a.seg === 'L' ? 'R' : 'L'; this.events.push({ type: 'cross', axle: 'car' });
        }
      } else { car.front.s += ds; car.rear.s += ds; }
      car.pose = this.poseOf(car.front, car.rear);
      this.drive(car.body, car.pose, dt);
      if (checks) {
        if (car.front.seg !== 'stem' && car.rear.seg !== 'stem' && car.front.seg !== car.rear.seg) return { reason: 'drift' };
        // 前の車両と別々の線路へ分かれた：連結器が開いたら泣き別れ
        const a = prev.rearPose, b = car.pose;
        const ax = a.x - a.dir.x * 2.2, az = a.z - a.dir.z * 2.2, bx = b.x + b.dir.x * 2.2, bz = b.z + b.dir.z * 2.2;
        if (Math.hypot(ax - bx, az - bz) > 0.5) return { reason: 'split' };
      }
      prev = { rearPose: car.pose, rear: car.rear };
    }
    return null;
  }

  buildWorld() {
    const w = this.world = new CANNON.World({ gravity: new CANNON.Vec3(0, -6.5, 0) });
    w.broadphase = new CANNON.SAPBroadphase(w);
    w.allowSleep = true;
    w.solver.iterations = 12;
    const mG = new CANNON.Material('ground'), mT = new CANNON.Material('trolley'), mP = new CANNON.Material('person'),
          mW = new CANNON.Material('wall'), mB = new CANNON.Material('ball');
    w.defaultContactMaterial.friction = 0.4; w.defaultContactMaterial.restitution = 0.2;
    const cm = (a, b, f, r) => w.addContactMaterial(new CANNON.ContactMaterial(a, b, { friction: f, restitution: r }));
    const fr = this.stage.friction || {};   // 氷のステージでは地面がよく滑る
    cm(mG, mT, fr.trolley ?? 0.08, 0.5); cm(mW, mT, 0.08, 0.8); cm(mG, mB, fr.ball ?? 0.2, 0.45); cm(mW, mB, 0.1, 0.7);
    cm(mG, mP, fr.person ?? 0.6, 0.1); cm(mT, mP, 0.3, 0.45); cm(mB, mP, 0.3, 0.5); cm(mT, mB, 0.15, 0.3);
    this.mats = { mG, mT, mP, mW, mB };

    const ground = new CANNON.Body({ mass: 0, material: mG });
    ground.addShape(new CANNON.Plane());
    ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    ground.isGround = true;
    w.addBody(ground);

    if (this.stage.sapAxis !== undefined) w.broadphase.axisIndex = this.stage.sapAxis;   // 奥行き方向に長い舞台
    this.walls = this.stage.walls.filter(wl => wl.phys !== false).map(wl => {
      const b = new CANNON.Body({ mass: 0, material: mW });
      b.addShape(new CANNON.Box(new CANNON.Vec3(wl.w / 2, wl.h / 2, wl.d / 2)));
      b.position.set(wl.x, wl.h / 2, wl.z); b.quaternion.setFromEuler(0, wl.yaw || 0, 0);
      b.isWall = true; w.addBody(b); return b;
    });

    this.people = this.stage.people.map((pp, i) => {
      const b = new CANNON.Body({ mass: 22, material: mP, linearDamping: 0.05, angularDamping: 0.15 });
      const an = pp.kind && ANIMAL[pp.kind], hh = an ? an.half : [0.24, 0.85, 0.18];
      b.addShape(new CANNON.Box(new CANNON.Vec3(...hh)));
      if (an) { b.mass = an.mass; b.updateMassProperties(); }
      b.position.set(pp.x, hh[1], pp.z); b.kind = pp.kind;
      b.aabbNeedsUpdate = true;   // 配置後に当たり判定の範囲を計算し直す（眠っている物体は自分では更新しない）
      b.personIndex = i; b.sleepSpeedLimit = 0.25;
      w.addBody(b); b.sleep();
      b.addEventListener('collide', e => this.onPersonContact(b, e));
      return b;
    });

    // トロッコ：走行中は座標で動かすキネマティック体、脱線したら同じ物体を動的に切り替える
    const tb = this.trolleyBody = this.makeCarBody();
    w.addBody(tb);
  }

  // 接触点（ワールド座標）
  contactPoint(c, self) {
    const p = c.bi === self ? c.bi.position.vadd(c.ri) : c.bj.position.vadd(c.rj);
    return { x: p.x, y: Math.max(0.05, p.y), z: p.z };
  }

  onTrolleyContact(e, self = this.trolleyBody) {
    if (e.body.isGround && this.reason) {
      const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
      if (v > 1.6 && this.t - (this.lastImpactT || -1) > 0.08) {
        this.lastImpactT = this.t;
        this.events.push({ type: 'impact', v, ...this.contactPoint(e.contact, self) });
      }
    }
    if (e.body.isWall) {
      this.events.push({ type: 'wallHit', ...this.contactPoint(e.contact, self) });
      if (!this.wallTouched) this.events.push({ type: 'wall' });
      this.wallTouched = true;
    }
  }

  onPersonContact(b, e) {
    const o = e.body, i = b.personIndex;
    if (this.hits.has(i)) return;
    let cause = null;
    if (o.isTrolley) cause = this.wallTouched ? '壁経由' : '直撃';
    else if (o.isBall) cause = '積荷';
    else if (o.personIndex !== undefined && this.hits.has(o.personIndex)) cause = '巻き添え';
    if (!cause) return;
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    if (v < 0.9) return;
    this.hits.set(i, cause);
    this.events.push({ type: 'hit', i, cause });
    this.pendingFling.push(b);
  }

  axlePos(a) { return PATHS[a.seg].sample(a.s); }

  updatePose(dt) {
    const F = this.axlePos(this.front), R = this.axlePos(this.rear);
    const dx = F.x - R.x, dz = F.z - R.z, d = Math.hypot(dx, dz) || 1;
    const dir = { x: dx / d, z: dz / d };
    const yaw = Math.atan2(-dir.x, -dir.z);
    if (this.prevYaw !== null && dt > 0) {
      let dy = yaw - this.prevYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      this.yawRate = dy / dt;
    }
    this.prevYaw = yaw;
    this.latA = this.speed * this.yawRate;   // +: 左カーブ（外側＝右）
    const mx = (F.x + R.x) / 2, mz = (F.z + R.z) / 2;
    this.pose = { x: mx, z: mz, yaw, dir, F, R, axleDist: d };
    // キネマティックな車体：速度を与えて world.step で目標位置へ動かす
    const tb = this.trolleyBody;
    // 向きも角速度で回す（壁が回ると球が押される）。現在の向きとの差から決めるので誤差が溜まらない
    if (dt > 0) {
      tb.velocity.set((mx - tb.position.x) / dt, 0, (mz - tb.position.z) / dt);
      const f = tb.quaternion.vmult(new CANNON.Vec3(0, 0, -1));
      let dyw = yaw - Math.atan2(-f.x, -f.z); dyw = Math.atan2(Math.sin(dyw), Math.cos(dyw));
      tb.angularVelocity.set(0, dyw / dt, 0);
    }
  }

  // 車体ローカル(x,z) → ワールド
  localToWorld(lx, lz, pose = this.pose) {
    const c = Math.cos(pose.yaw), s = Math.sin(pose.yaw);
    return { x: pose.x + lx * c + lz * s, z: pose.z - lx * s + lz * c };
  }
  ballPositions() {
    return this.balls.map(b => ({ x: b.position.x, y: b.position.y, z: b.position.z, q: b.quaternion }));
  }

  step() {
    const dt = DT;
    if (this.headless) this.events.length = 0;
    this.t += dt;
    if (this.state === 'rail') this.railStep(dt);
    else if (this.state === 'derailed') this.freeStep(dt);
    else if (!this.reason) {   // 線路上で終わった後も、そのまま走り続ける
      const ds = this.speed * dt; this.front.s += ds; this.rear.s += ds;
      this.updatePose(dt); this.moveCars(ds, dt, false); this.world.step(dt);
    } else this.world.step(dt);
    for (const b of this.pendingFling) {
      b.wakeUp(); b.velocity.y += 3.2; b.angularVelocity.x += 3; b.angularVelocity.z += 2;
    }
    this.pendingFling.length = 0;
  }

  // トングレール：バーにわずかに遅れて追従（臨界減衰バネ）
  tongueStep(dt) {
    if (this.p > 0.05) this.leverMoved = true;
    const w = 40, acc = w * w * (this.p - this.q) - 2 * w * this.qv;
    this.qv += acc * dt; this.q += this.qv * dt;
    if (this.q < 0) { if (this.qv < -0.4) this.events.push({ type: 'clunk' }); this.q = 0; this.qv = 0; }
    if (this.q > 1) { if (this.qv > 0.4) this.events.push({ type: 'clunk' }); this.q = 1; this.qv = 0; }
  }

  // 連結車両：先頭車が脱線したあとも、2両目以降は線路の上を走り続ける。
  // 伸び縮みする連結器で先頭車とつながり、伸びすぎるか車輪が泣き別れたら2両目も脱線する
  railCarsStep(dt) {
    this.tongueStep(dt);
    this.carSpeed = Math.max(0, this.carSpeed - (this.stage.carBrake ?? 5) * dt);
    const ds = this.carSpeed * dt, car = this.cars[0];
    for (const c of this.cars) {
      for (const a of [c.front, c.rear]) {
        const r = this.advance(a, ds, null);
        if (r) return this.detachCars('climb');
      }
      for (const a of [c.front, c.rear]) if (a.seg !== 'stem' && a.s < TONGUE && ((a.seg === 'L' && this.q > 0.5) || (a.seg === 'R' && this.q < 0.5))) {
        a.seg = a.seg === 'L' ? 'R' : 'L'; this.events.push({ type: 'cross', axle: 'car' });
      }
      c.pose = this.poseOf(c.front, c.rear);
      this.drive(c.body, c.pose, dt);
      if (c.front.seg !== 'stem' && c.rear.seg !== 'stem' && c.front.seg !== c.rear.seg) return this.detachCars('drift');
    }
    // 連結器：先頭車の後端と2両目の前端をばねで引き合わせる（引っ張る力には上限）
    const tb = this.trolleyBody, a = tb.pointToWorldFrame(new CANNON.Vec3(0, -0.1, 2.2));
    const bx = car.pose.x + car.pose.dir.x * 2.2, bz = car.pose.z + car.pose.dir.z * 2.2, by = BODY_Y - 0.1;
    const dx = bx - a.x, dy = by - a.y, dz = bz - a.z, d = Math.hypot(dx, dy, dz);
    this.couplerStretch = d;
    if (d > 1.6) return this.detachCars('coupler');
    if (d > 1e-3) {
      const f = Math.min(this.stage.carMass ?? 180, 600) * Math.min(30, d * 25) / d;
      tb.applyForce(new CANNON.Vec3(dx * f, dy * f, dz * f), a);
    }
  }
  // 線路に残っていた車両も脱線させ、連結器でつなぐ
  detachCars(why) {
    if (!this.carsOnRail) return;
    this.carsOnRail = false;
    const carMass = this.stage.carMass ?? 180;
    let front = this.trolleyBody;
    for (const c of this.cars) {
      const b = c.body;
      b.type = CANNON.Body.DYNAMIC; b.mass = carMass; b.updateMassProperties(); b.wakeUp();
      b.velocity.set(c.pose.dir.x * this.carSpeed, 0.3, c.pose.dir.z * this.carSpeed); b.angularVelocity.set(0, why === 'drift' ? 2 * (c.front.seg === 'L' ? 1 : -1) : 0, 0);
      this.world.addConstraint(new CANNON.PointToPointConstraint(front, new CANNON.Vec3(0, -0.1, 2.2), b, new CANNON.Vec3(0, -0.1, -2.2), 30 * carMass));
      front = b;
    }
    this.events.push({ type: 'derail2', why, x: this.cars[0].pose.x, z: this.cars[0].pose.z });
  }

  railStep(dt) {
    this.tongueStep(dt);

    const ds = this.speed * dt;
    let r = this.advance(this.front, ds, 'front'); if (r) return this.derail(r);
    r = this.advance(this.rear, ds, 'rear'); if (r) return this.derail(r);

    // トングレール上にいる車輪の下で切替器を動かした
    for (const [a, name] of [[this.front, 'front'], [this.rear, 'rear']]) {
      if (a.seg !== 'stem' && a.s < TONGUE) {
        if ((a.seg === 'L' && this.q > 0.5) || (a.seg === 'R' && this.q < 0.5))
          return this.derail({ reason: 'shove', axle: name });
      }
    }

    this.updatePose(dt);
    const drift = this.front.seg !== 'stem' && this.rear.seg !== 'stem' && this.front.seg !== this.rear.seg;
    if (drift) {
      const Ft = this.pose.F, d = this.pose.dir;
      const ang = Math.abs(Math.atan2(d.x * Ft.tz - d.z * Ft.tx, d.x * Ft.tx + d.z * Ft.tz));
      if (ang > 0.22 || Math.abs(this.pose.axleDist - WHEELBASE) > 0.2) return this.derail({ reason: 'drift' });
    } else if (Math.abs(this.latA) > 8.5) {
      return this.derail({ reason: 'overturn' });
    }
    if (this.cars.length) { const r = this.moveCars(ds, dt, true); if (r) return this.derail(r); }

    if (this.front.seg !== 'stem' && this.front.s > (this.stage.endS ?? 46)) {
      this.endT += dt; if (this.endT > 1.2) this.finish();
    }
    this.world.step(dt);
  }

  advance(a, ds, name) {
    a.s += ds;
    if (a.seg === 'stem' && a.s >= LS) {
      const over = a.s - LS, q = this.q;
      if (name) this.marks[name] = q;
      this.events.push({ type: 'cross', axle: name || 'car' });
      if (q <= BAND_LO) a.seg = 'L';
      else if (q >= BAND_HI) a.seg = 'R';
      else return { reason: name === 'front' ? 'climb' : 'rear-climb', q, qv: this.qv };
      a.s = over;
    }
    return null;
  }

  // 脱線判定の結果 → 物理へ渡す初速と回転（乱数なし・決定的）
  derail(info) {
    this.state = 'derailed'; this.reason = info.reason; this.derailT = 0;
    const q = info.q ?? this.q, qv = info.qv ?? this.qv;
    const u = Math.min(1, Math.max(0, (q - BAND_LO) / (BAND_HI - BAND_LO)));
    const mid = 1 - Math.abs(2 * u - 1);
    const sgn = v => (v < 0 ? -1 : 1);
    const k = { head: 0, side: 0, vy: 0.6, yaw: this.yawRate, roll: 0, pitch: 0, sp: 0.92 };
    switch (info.reason) {
      case 'climb':
        k.head = (u - 0.5) * 0.9 + 0.3 * Math.sin(11 * u + 1.3 * qv);
        k.vy = 0.9 + 1.8 * mid; k.yaw = 3.5 * Math.sin(7 * u + 0.8 * qv);
        k.roll = 2.6 * (u - 0.5) + 1.6 * Math.sin(17 * u); k.pitch = 0.8 * mid; k.sp = 1.05; break;
      case 'rear-climb': {
        const fs = this.front.seg === 'L' ? 1 : -1;   // 前輪が左へ→後輪は右へ振れる→左旋回
        k.yaw = fs * (3 + 4 * mid) + 1.5 * Math.sin(9 * u + qv);
        k.side = -fs * 1.5 * mid; k.vy = 0.6 + 1.2 * mid; k.roll = 2.2 * Math.sin(13 * u); k.sp = 1.0; break;
      }
      case 'shove': {
        const s = sgn(qv);
        k.side = s * (2.5 + Math.min(Math.abs(qv), 6) * 0.5); k.yaw = -s * (2 + Math.abs(Math.sin(3 * q + qv))) ; k.vy = 1.3; k.roll = s * 2.6; k.sp = 1.0; break;
      }
      case 'drift':
        { const e = this.pose.axleDist - WHEELBASE;   // 前後輪の開き具合で回り方が変わる
          k.yaw = this.yawRate * (2.2 + 4 * e); k.vy = 1.6 + 2 * Math.abs(e); k.roll = sgn(this.latA) * 2.4;
          k.head = 0.5 * Math.sin(9 * e + this.q * 3); k.sp = 1.0; break; }
      case 'overturn':
        k.roll = sgn(this.latA) * 3.2; k.vy = 0.8; break;
      case 'split':   // 先頭車はそのままの勢い。連結器に引っ張られて後ろが振り回される
        k.vy = 0.3; k.sp = 1.0; break;
    }
    const d = this.pose.dir, right = { x: -d.z, z: d.x };
    const c = Math.cos(k.head), s = Math.sin(k.head);
    const hx = d.x * c + right.x * s, hz = d.z * c + right.z * s;
    const sp = this.speed * k.sp * (this.stage.derailBoost ?? 1);
    const vel = new CANNON.Vec3(hx * sp - hz * k.side, k.vy, hz * sp + hx * k.side);
    const fwd = new CANNON.Vec3(hx, 0, hz), rgt = new CANNON.Vec3(-hz, 0, hx);
    const av = new CANNON.Vec3(0, k.yaw, 0).vadd(fwd.scale(k.roll)).vadd(rgt.scale(k.pitch));

    // 同じ物体をキネマティック → 動的に切り替える。荷台の球はそのまま載っている
    const tb = this.trolleyBody;
    const carMass = this.stage.carMass ?? 180;
    tb.type = CANNON.Body.DYNAMIC; tb.mass = carMass; tb.updateMassProperties();
    tb.velocity.copy(vel); tb.angularVelocity.copy(av); tb.wakeUp();
    // 連結車両：2両目以降は、連結器に引き出されるまで線路に残す
    if (this.stage.hybridCars && this.cars.length) {
      this.carsOnRail = true; this.carSpeed = this.speed;
      this.events.push({ type: 'derail', reason: info.reason, x: this.pose.F.x, z: this.pose.F.z, vx: vel.x, vz: vel.z });
      return;
    }
    // 2両目以降も自由に動く物体にして、連結器（車体の端どうしを結ぶ点の拘束）でつなぐ
    let front = tb;
    for (const car of this.cars) {
      const b = car.body;
      b.type = CANNON.Body.DYNAMIC; b.mass = carMass; b.updateMassProperties(); b.wakeUp();
      b.angularVelocity.set(0, 0, 0);
      this.world.addConstraint(new CANNON.PointToPointConstraint(front, new CANNON.Vec3(0, -0.1, 2.2), b, new CANNON.Vec3(0, -0.1, -2.2), 50 * carMass));
      front = b;
    }
    this.events.push({ type: 'derail', reason: info.reason, x: this.pose.F.x, z: this.pose.F.z, vx: vel.x, vz: vel.z });
  }

  freeStep(dt) {
    this.derailT += dt;
    if (this.carsOnRail) this.railCarsStep(dt);
    this.world.step(dt);
    const tb = this.trolleyBody;
    const slow = this.bodies.every(b => b.velocity.length() < 0.35 && b.angularVelocity.length() < 0.6) &&
      this.balls.every(b => b.velocity.length() < 0.5);
    if ((this.derailT > 2 && slow && !(this.carsOnRail && this.carSpeed > 0.5)) || this.derailT > 9 || tb.position.y < -10) {
      this.endT += dt;
      if (this.endT > 0.6 || this.derailT > 9) this.finish();
    }
  }

  finish() { this.state = 'done'; this.events.push({ type: 'done' }); }

  summary() {
    const by = {};
    const animals = {};
    for (const [i, c] of this.hits) { const k = this.stage.people[i].kind; if (k) animals[k] = true; else by[c] = (by[c] || 0) + 1; }
    const total = [...this.hits.keys()].filter(i => !this.stage.people[i].kind).length;
    return {
      total, by, animals, derailed: !!this.reason, reason: this.reason, stageId: this.stage.id,
      route: this.front.seg, leverMoved: this.leverMoved, marks: { ...this.marks },
      fiveHit: [0, 1, 2, 3, 4].filter(i => this.hits.has(i)).length, oneHit: this.hits.has(5) ? 1 : 0,
    };
  }
}

// 称号の一覧（記録画面の図鑑用）。数字が入る称号は1種類として数える
const TITLES = [
  ['倫理を物理で解決した者'], ['マルチトラックで全員を救った者'], ['奇跡の係員'], ['泣き別れさせた人'],
  ['無駄にかちゃかちゃした人'], ['5人も1人も救えなかった人'], ['壁に相談した者'], ['積荷に任せた者', /^(積荷|球)に任せた者$/],
  ['マルチトラックドリフトの代償'], ['何もしなかった人'], ['わざわざ5人の方へ戻した人'], ['1人のつもりがN人', /^1人のつもりが\d+人$/],
  ['教科書どおりの功利主義者'], ['脱線させたのにN人', /^脱線させたのに\d+人$/],
  ['犬派'], ['猫派'], ['猫も犬も救った人'], ['猫も犬も救えなかった人'], ['動物のためにストライク'], ['動物愛護の代償'],
  ['ストライク'], ['N人をなぎ倒した人', /^\d+人をなぎ倒した人$/],
  ['たくさん遊んでくれてありがとう'],   // 結果には出さず、通算20回で図鑑にだけ入る
].map(([name, re]) => ({ name, re }));
function titleKey(t) { const i = TITLES.findIndex(x => x.re ? x.re.test(t) : x.name === t); return i < 0 ? null : TITLES[i].name; }

function titleFor(sm) {
  const only = c => Object.keys(sm.by).length === 1 && sm.by[c];
  if (sm.total === 0 && sm.derailed) return sm.reason === 'drift' ? 'マルチトラックで全員を救った者' : '倫理を物理で解決した者';
  if (sm.stageId === 3) {
    const cat = sm.animals.cat, dog = sm.animals.dog;
    if (sm.total === 0) return cat && dog ? '猫も犬も救えなかった人' : cat ? '犬派' : dog ? '猫派' : '猫も犬も救った人';
    if (!cat && !dog) return sm.total === 10 ? '動物のためにストライク' : '動物愛護の代償';
  }
  if (sm.total === 0) return '奇跡の係員';
  if (sm.stageId === 3) return sm.total === 10 ? 'ストライク' : sm.reason === 'split' ? '泣き別れさせた人' : sm.reason === 'drift' ? 'マルチトラックドリフトの代償' : `${sm.total}人をなぎ倒した人`;
  if (sm.reason === 'split') return '泣き別れさせた人';
  if (sm.throws >= 8) return '無駄にかちゃかちゃした人';
  if (sm.fiveHit === 5 && sm.oneHit) return '5人も1人も救えなかった人';
  if (sm.by['壁経由']) return '壁に相談した者';
  if (only('積荷')) return '積荷に任せた者';
  if (sm.reason === 'drift') return 'マルチトラックドリフトの代償';
  if (!sm.derailed && sm.route === 'L' && !sm.leverMoved) return '何もしなかった人';
  if (!sm.derailed && sm.route === 'L') return 'わざわざ5人の方へ戻した人';
  if (!sm.derailed && sm.route === 'R' && sm.total >= 2) return `1人のつもりが${sm.total}人`;
  if (!sm.derailed && sm.route === 'R') return '教科書どおりの功利主義者';
  return `脱線させたのに${sm.total}人`;
}

/* =========================================================
   ヒートマップ検証モード（?heatmap）
   a = 前輪が先端を通過するまでのバー位置、b = 通過後のバー位置
   ========================================================= */
async function runHeatmap() {
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('heat'); el.style.display = 'block';
  const N = +(new URLSearchParams(location.search).get('n') || 25);
  const D0 = -2.5, D1 = 4.0;   // 操作タイミング：前輪が先端の何m手前(-)／先(+)にいる時にバーを動かすか
  el.innerHTML = `<b>脱線条件ヒートマップ</b> ${N}×${N}　定位から1回だけバーを動かす。縦: 操作タイミング（上=先端の${-D0}m手前 → 下=先端を${D1}m過ぎ）　横: 動かした先のバー位置（左=0 定位 → 右=1 反位）<div id="hm-prog"></div>`;
  const cv = document.createElement('canvas'); const cell = 16;
  cv.width = N * cell; cv.height = N * cell; el.appendChild(cv);
  const ctx = cv.getContext('2d');
  const colors = ['#3fae5a', '#e8c547', '#ef9f27', '#e0703a', '#d0453e', '#a3262a', '#5b1416'];
  const res = []; const tally = {};
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const d = D0 + (D1 - D0) * i / (N - 1), b = j / (N - 1), a = d;
      const sim = new Sim(STAGE, { headless: true, startGap: 8, p0: 0 });
      let n = 0;
      while (sim.state !== 'done' && n < 20 / DT) {
        const fd = sim.front.seg === 'stem' ? sim.front.s - LS : sim.front.s;
        if (fd >= d) sim.p = b;
        sim.step(); n++;
        if (sim.reason && n % 24 === 0) (sim._path ||= []).push([+sim.trolleyBody.position.x.toFixed(1), +sim.trolleyBody.position.z.toFixed(1)]);
      }
      const sm = sim.summary();
      const tp = sim.trolleyBody.position; const out = sim.balls.filter(bb => bb.position.distanceTo(tp) > 2.2).length; res.push({ out, a, b, total: sm.total, reason: sm.reason || ('rail-' + sm.route), by: sm.by, tx: +tp.x.toFixed(1), tz: +tp.z.toFixed(1), path: sim._path });
      const key = (sm.reason || 'rail-' + sm.route);
      tally[key] = tally[key] || { n: 0, zero: 0, hits: {} };
      tally[key].n++; if (sm.total === 0) tally[key].zero++;
      tally[key].hits[sm.total] = (tally[key].hits[sm.total] || 0) + 1;
      ctx.fillStyle = colors[Math.min(6, sm.total)];
      ctx.fillRect(j * cell, i * cell, cell - 1, cell - 1);
      if (sm.reason) { ctx.fillStyle = '#0006'; ctx.font = '9px monospace'; ctx.fillText(sm.reason[0].toUpperCase(), j * cell + 4, i * cell + 11); }
    }
    document.getElementById('hm-prog').textContent = `${i + 1}/${N}`;
    await new Promise(r => setTimeout(r, 0));
  }
  const zero = res.filter(r => r.total === 0).length;
  const pre = document.createElement('pre');
  pre.textContent = `全員生存 ${zero}/${res.length} (${(zero / res.length * 100).toFixed(1)}%)\n` +
    Object.entries(tally).map(([k, v]) => `${k}: ${v.n}件 / 全員生存 ${v.zero} / 被害分布 ${JSON.stringify(v.hits)}`).join('\n');
  el.appendChild(pre);
  const lg = document.createElement('div'); lg.className = 'legend';
  lg.innerHTML = '被害人数 ' + colors.map((c, i) => `<span style="background:${c}"></span>${i}`).join('') +
    '　文字 C=乗り上がり R=後輪 S=割り込み D=ドリフト O=転覆';
  el.appendChild(lg);
  window.__heatmap = { res, tally, zero };
}

window.__dev = { Sim, get STAGE() { return STAGE; }, DT, useStage, makeStage2, STAGES };

/* =========================================================
   ゲーム本体（描画・入力・UI）

function startGame() {
  const view = document.getElementById('view');
  const boardCv = document.getElementById('board');
  const leverCv = document.getElementById('lever');
  const reasonEl = document.getElementById('reason');
  const flashEl = document.getElementById('flash');
  const tunnelEl = document.getElementById('tunnel');

  // ---------- three.js ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  view.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  // 空：上は青、地平は砂ぼこりで黄ばむ
  let skyTex;

    stroke(PATHS.L, TONGUE, 34, q <= BAND_LO ? setCol : base, lw);
    stroke(PATHS.R, TONGUE, 34, q >= BAND_HI ? setCol : base, lw);

    // 在線区間（赤）
    if (sim && !derailed) {
      // 連結した全車両の区間を赤く（先頭車の前輪から最後尾の後輪まで）
      const red = '#e24b4a';
      const occ = (f, r) => {
        if (f.seg === r.seg) stroke(PATHS[f.seg], r.s - 0.6, f.s + 0.6, red, lw);
        else {
          if (r.seg === 'stem') stroke(PATHS.stem, r.s - 0.6, LS, red, lw); else stroke(PATHS[r.seg], 0, r.s + 0.6, red, lw);
          stroke(PATHS[f.seg], 0, f.s + 0.6, red, lw);
        }
      };
      occ(sim.front, sim.rear);
      let prevRear = sim.rear;
      for (const car of sim.cars) { occ(prevRear, car.front); occ(car.front, car.rear); prevRear = car.rear; }
    }
    if (derailed && blink) {
      stroke(PATHS.stem, LS - 14, LS, '#e24b4a', lw); stroke(PATHS.L, 0, 34, '#e24b4a', lw); stroke(PATHS.R, 0, 34, '#e24b4a', lw);
    }

    // 目盛り
    ctx.strokeStyle = '#8d8a80'; ctx.lineWidth = 1.5;
    for (let z = 1; z <= 8; z++) {
      const [x, y] = C(0, z); const len = (z % 2 ? 0.35 : 0.6) * sc;
      ctx.beginPath(); ctx.moveTo(x + lw, y); ctx.lineTo(x + lw + len, y); ctx.stroke();
    }
    const mismatch = q > BAND_LO && q < BAND_HI;
    // 危険範囲
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; ctx.strokeStyle = mismatch && blink ? '#ffcf7a' : '#ef9f27aa';
    const [cx, cy] = C(0, -TONGUE / 2);
    ctx.beginPath(); ctx.arc(cx, cy, (TONGUE / 2 + 0.7) * sc, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

    // 車輪
    if (sim && !derailed) {
      const F = sim.axlePos(sim.front), R = sim.axlePos(sim.rear);
      const drift = sim.front.seg !== sim.rear.seg && sim.rear.seg !== 'stem';
      const [fx, fy] = C(F.x, F.z), [rx, ry] = C(R.x, R.z);
      ctx.strokeStyle = drift ? (blink ? '#ff6a5a' : '#7a2a24') : '#d8d4c8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(rx, ry); ctx.stroke();
      const axle = (P, x, y, col, tri) => {
        const ang = Math.atan2(P.tz, P.tx) + Math.PI / 2, L = 0.75 * sc;
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
        ctx.fillStyle = col; ctx.fillRect(-L, -2.5, L * 2, 5);
        if (tri) { ctx.beginPath(); ctx.moveTo(-6, -5); ctx.lineTo(0, -13); ctx.lineTo(6, -5); ctx.fill(); }
        ctx.restore();
      };
      axle(R, rx, ry, '#a9a69b', false);
      axle(F, fx, fy, '#ffffff', true);
      for (const car of sim.cars) {   // 2両目以降
        const F2 = sim.axlePos(car.front), R2 = sim.axlePos(car.rear), [a1, b1] = C(F2.x, F2.z), [a2, b2] = C(R2.x, R2.z);
        ctx.strokeStyle = car.front.seg !== car.rear.seg && car.rear.seg !== 'stem' ? (blink ? '#ff6a5a' : '#7a2a24') : '#8d8a80'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(a1, b1); ctx.lineTo(a2, b2); ctx.stroke();
        axle(F2, a1, b1, '#c9c5b8', false); axle(R2, a2, b2, '#8d8a80', false);
      }
    }

    // ---- 分岐器の拡大図（右側の枠） ----
    {
      const bw = Math.min(118, W * 0.32), bx = W - bw - 8, by = 8, bh = H - 16;
      // 縦の範囲：分岐の先3.2mから、連結した最後尾の後輪が見えるところまで
      const zTop = -3.2, zBot = 1.4 + ((STAGE.cars ?? 1) - 1) * (WHEELBASE + CAR_GAP) * 1.15;
      const isc = Math.min(bw / 2.6, (bh - 18) / (zBot - zTop)), ox = bx + bw / 2, ytop = by + 18;
      const I = (x, z) => [ox + x * isc, ytop + (z - zTop) * isc];
      ctx.fillStyle = '#0b0c0a'; ctx.strokeStyle = '#2c2f29'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8d8a80'; ctx.font = '10px DotGothic16, monospace'; ctx.textAlign = 'left';
      ctx.fillText('分岐器', bx + 6, by + 13);
      ctx.save(); ctx.beginPath(); ctx.rect(bx, by + 16, bw, bh - 16); ctx.clip();
      const g = tongueGeom(q), thin = Math.max(1.5, isc * 0.05);
      const iseg = (a, b) => { const [ax, ay] = I(a.x, a.z), [bx2, by2] = I(b.x, b.z); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); ctx.stroke(); };
      const irail = (path, s0, s1, off) => { ctx.beginPath(); for (let s2 = s0, f = true; s2 <= s1 + 1e-3; s2 += 0.2, f = false) { const pp = railXZ(path, Math.min(s2, s1), off); const [x, y] = I(pp.x, pp.z); f ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); };
      // 開いた隙間
      for (const [gap, a, b2] of [[g.gapL, -0.45, g.lTip.x], [g.gapR, g.rTip.x, 0.45]]) {
        if (gap < 0.03) continue;
        const [ax, y0] = I(a, 0), [bx3, y1] = I(b2, -1.1);
        ctx.fillStyle = mismatch ? (blink ? '#ff3b2fee' : '#ff3b2f88') : '#ff3b2f55';
        ctx.fillRect(ax, y0, bx3 - ax, y1 - y0);
      }
      ctx.strokeStyle = '#c4c0b2'; ctx.lineWidth = thin * 1.3;
      irail(PATHS.stem, LS - zBot - 1, LS, -0.5); irail(PATHS.stem, LS - zBot - 1, LS, 0.5);
      irail(PATHS.L, 0, TV + 1, -0.5); irail(PATHS.R, 0, TV + 1, 0.5);
      irail(PATHS.L, TV, TV + 1, 0.5); irail(PATHS.R, TV, TV + 1, -0.5);
      ctx.strokeStyle = '#6b6e72'; iseg({ x: g.lTip.x - 0.12, z: -0.35 }, { x: g.rTip.x + 0.12, z: -0.35 });
      ctx.strokeStyle = mismatch ? (blink ? '#ffc061' : '#ef9f27') : '#7fd18b';
      ctx.lineWidth = thin * 2.4; ctx.lineCap = 'round';
      iseg(g.lTip, g.lHeel); iseg(g.rTip, g.rHeel);
      // 車輪
      if (sim && !derailed) {
        for (const [ax, col] of [...sim.cars.flatMap(c => [[c.rear, '#8d8a80'], [c.front, '#c9c5b8']]), [sim.rear, '#a9a69b'], [sim.front, '#ffffff']]) {
          const P = sim.axlePos(ax);
          const [x, y] = I(P.x, P.z), ang = Math.atan2(P.tz, P.tx) + Math.PI / 2, L2 = 0.6 * isc;
          ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col; ctx.fillRect(-L2, -2, L2 * 2, 4); ctx.restore();
        }
      }
      ctx.restore();
      ctx.fillStyle = mismatch ? '#ef9f27' : '#7fd18b'; ctx.font = '10px DotGothic16, monospace'; ctx.textAlign = 'center';
      ctx.textAlign = 'right'; ctx.fillText(mismatch ? '隙間あり' : (q <= BAND_LO ? '左開通' : '右開通'), bx + bw - 6, by + 13);
    }

    // 作業員：実際の位置に点で描く（盤面では人は点にすぎない）。轢かれた人は赤
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, mainW + 8, H); ctx.clip();
    const pr = Math.max(2.4, sc * 0.26);
    STAGE.people.forEach((pp, i) => {
      const pos = sim ? sim.people[i].position : pp, hit = sim && sim.hits.has(i);
      let [x, y] = C(pos.x, pos.z);
      ctx.fillStyle = hit ? '#ff4a3a' : pp.kind === 'cat' ? '#f0a54a' : pp.kind === 'dog' ? '#c08a5a' : '#e9e5d8';
      if (y < 6) { y = 8; ctx.font = '9px DotGothic16, monospace'; ctx.textAlign = 'center'; ctx.fillText('▲', x, y + 3); return; }
      ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // ランプ
    ctx.textAlign = 'left'; ctx.font = '11px DotGothic16, monospace';
    const lamp = (x, y, on, col, label) => {
      ctx.fillStyle = on ? col : '#2e302b'; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
      if (on) { ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0; }
      ctx.fillStyle = on ? '#e9e5d8' : '#6b6a62'; ctx.fillText(label, x + 11, y + 4);
    };
    const railMode = !derailed;
    lamp(14, 16, railMode && q <= BAND_LO, '#7fd18b', '定位');
    lamp(14, 34, railMode && q >= BAND_HI, '#7fd18b', '反位');
    lamp(14, 52, railMode && mismatch && blink, '#ef9f27', '不整合');
    if (derailed) lamp(14, 70, blink, '#e24b4a', '異常');
  }

  // ---------- バー ----------
  function drawLever() {
    const ctx = leverCv.getContext('2d'), dpr = Math.min(2, devicePixelRatio);
    const W = leverCv.width / dpr, H = leverCv.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const pad = 34, x0 = pad, x1 = W - pad, y = H / 2 + 4;
    // 溝
    ctx.fillStyle = '#0d0e0c'; ctx.beginPath(); ctx.roundRect(x0 - 12, y - 7, x1 - x0 + 24, 14, 7); ctx.fill();
    // 刻み（かちゃかちゃ鳴る位置）。中間の不安定な範囲は琥珀色
    for (let i = 0; i <= 12; i++) {
      const v = i / 12, xx = x0 + (x1 - x0) * v, mid = v > BAND_LO && v < BAND_HI;
      ctx.fillStyle = mid ? '#ef9f2766' : '#7fd18b88';
      ctx.fillRect(xx - 1, y + 10, 2, i % 6 === 0 ? 8 : 5);
    }
    // 端
    ctx.font = '12px DotGothic16, monospace'; ctx.fillStyle = '#8d8a80'; ctx.textAlign = 'center';
    ctx.fillText('左', 14, y + 4); ctx.fillText('右', W - 14, y + 4);
    // 前回の操作
    if (lastMarks) {
      for (const [k, col, lab] of [['front', '#ffffffaa', '前'], ['rear', '#a9a69b99', '後']]) {
        const v = lastMarks[k]; if (v == null) continue;
        const x = x0 + (x1 - x0) * v;
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 14); ctx.stroke();
        ctx.fillStyle = col; ctx.font = '10px DotGothic16, monospace'; ctx.fillText(lab, x, y - 18);
      }
    }
    // つまみ（転てつてこ）
    const x = x0 + (x1 - x0) * lever;
    const atEnd = lever <= BAND_LO || lever >= BAND_HI;
    ctx.strokeStyle = '#2a2a28'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(W / 2, y + 30); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = atEnd ? '#d9d4c4' : '#ef9f27';
    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00000033'; ctx.beginPath(); ctx.arc(x + 3, y + 3, 9, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- リザルト ----------
  function showResult() {
    const sm = sim.summary();
    sm.throws = throws;
    lastMarks = sm.marks;
    history.push(sm);
    document.getElementById('rTitle').textContent = titleFor(sm);
    document.getElementById('rTotal').textContent = `${sm.total}人`;
    const chips = document.getElementById('rChips'); chips.innerHTML = '';
    const order = ['直撃', '壁経由', '積荷', '巻き添え'];
    for (const k of order) if (sm.by[k]) { const s = document.createElement('span'); s.className = 'chip'; s.textContent = `${k} ${sm.by[k]}人`; chips.appendChild(s); }
    for (const k of ['cat', 'dog']) if (sm.animals && sm.animals[k]) { const s = document.createElement('span'); s.className = 'chip'; s.textContent = `${ANIMAL[k].name} 1${ANIMAL[k].unit}`; chips.appendChild(s); }
    if (!sm.total && !Object.keys(sm.animals || {}).length) { const s = document.createElement('span'); s.className = 'chip'; s.textContent = '被害なし'; chips.appendChild(s); }
    { const s = document.createElement('span'); s.className = 'chip'; s.textContent = `切替 ${sm.throws}回`; chips.appendChild(s); }
    let note = sm.derailed ? `原因：${REASON_LABEL[sm.reason]}` : (sm.route === 'L' ? '定位のまま通過' : '反位へ切替えて通過');
    const normal = history.filter(h => !h.derailed && h.leverMoved).length;
    if (history.length >= 5 && normal === 0) note += '　／　あなたは線路を普通に切り替えたことが一度もありません';
    document.getElementById('rNote').textContent = note;
    // 記録とステージ開放
    const before = isUnlocked(stageIdx + 1);
    save.plays[stageIdx]++;
    { const t = save.st[stageIdx]; t.n += sm.total; if (!sm.total && !Object.keys(sm.animals || {}).length) t.z++; if (sm.derailed) t.d++; for (const k of ['cat', 'dog']) if (sm.animals && sm.animals[k]) t[k]++; }
    { const k = titleKey(document.getElementById('rTitle').textContent); if (k) save.titles[k] = (save.titles[k] || 0) + 1; }
    if (save.plays.reduce((a, b) => a + b, 0) >= THANKS_PLAYS) save.titles['たくさん遊んでくれてありがとう'] = 1;
    save.log.push({ s: stageIdx, t: document.getElementById('rTitle').textContent, n: sm.total, a: Object.keys(sm.animals || {}).length, d: sm.derailed ? 1 : 0, ts: Date.now() });
    if (save.log.length > LOG_MAX) save.log.splice(0, save.log.length - LOG_MAX);
    persist();
    const um = document.getElementById('unlockMsg'), nx = stageIdx + 1;
    um.classList.remove('new');
    if (nx >= STAGES.length) um.hidden = true;
    else if (!before && isUnlocked(nx)) { um.hidden = false; um.classList.add('new'); um.textContent = `ステージ${nx + 1}「${STAGES[nx].short}」が開放されました`; }
    else if (!isUnlocked(nx)) { um.hidden = false; um.textContent = `あと${UNLOCK_PLAYS - save.plays[stageIdx]}回のプレイで次のステージが開放されます`; }
    else um.hidden = true;
    setTimeout(() => { if (sim && !running && !replay) { document.getElementById('resultOv').hidden = false; startReplay(); } }, 900);
  }

  // 操作の記録を短い文字列にする（同じ値が続く所はまとめる）。不具合の再現用
  function encodeRec() {
    const runs = []; let prev = null, n = 0;
    for (const v of rec) { const q = Math.round(v * 1000); if (q === prev) n++; else { if (prev !== null) runs.push(n > 1 ? `${prev}*${n}` : `${prev}`); prev = q; n = 1; } }
    if (prev !== null) runs.push(n > 1 ? `${prev}*${n}` : `${prev}`);
    return `TROLLEY1|s${stageIdx + 1}|g${runGap}|${runs.join(',')}`;
  }
  // リプレイの一時停止とコマ送り（1/30秒）
  let paused = false, stepReq = 0;
  const pbar = document.getElementById('pbar'), pauseBtn = document.getElementById('pauseBtn'), stepBtn = document.getElementById('stepBtn'), replayTxt = document.getElementById('replayTxt');
  function setPaused(v) {
    paused = v; pauseBtn.textContent = v ? '▶ 再生' : '⏸ 一時停止'; stepBtn.hidden = !v;
    replayTxt.textContent = v ? 'PAUSE' : 'REPLAY'; replayTag.querySelector('.rec').style.visibility = v ? 'hidden' : '';
  }
  pauseBtn.onclick = () => setPaused(!paused);
  stepBtn.onclick = () => { stepReq += 4; };
  addEventListener('keydown', e => {
    if (!replay) return;
    if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
    else if (e.key === '.' && paused) stepReq += 4;
  });

  function startReplay(at) {
    const lead = Math.round(1.6 / DT);
    const key = keyStep ?? crossStep ?? rec.length;
    const start = Math.max(0, key - lead);
    let end;
    if (keyStep !== null) end = (doneStep ?? rec.length) + Math.round(1.5 / DT);
    // 脱線しなかった走行：車載で坑口がある場合だけ、暗闇が続くところまで長めに流す
    else if (replayCam === 'onboard' && STAGE.portalZ !== undefined) end = (doneStep ?? rec.length) + Math.round(3.2 / DT);
    // それ以外は、最後に人に当たってから約2秒で切り上げる
    else end = Math.min(rec.length, Math.max(lastHitStep ?? 0, (crossStep ?? 0) + Math.round(1.5 / DT)) + Math.round(2.2 / DT));
    const rs = new Sim(STAGE, { startGap: runGap, p0: 0 });
    for (let i = 0; i < start; i++) { rs.p = rec[i]; rs.step(); }
    rs.events.length = 0;
    resetFX();
    // 一時停止中のカメラ切替：同じ瞬間まで進めて、ぶつかった人の色だけ反映する
    let i0 = start;
    if (at !== undefined && at > start) {
      for (; i0 < Math.min(at, end); i0++) { rs.p = rec[Math.min(i0, rec.length - 1)] ?? 0; rs.step(); }
      for (const ev of rs.events) if (ev.type === 'hit') { const pm = personMeshes[ev.i]; pm.userData.parts.forEach(m => (m.material = hitMat)); if (pm.userData.helmet) pm.userData.helmet.visible = false; }
      rs.events.length = 0;
    }
    hitStop = 0; fovKick = 0; flashT = 0; reasonEl.style.opacity = 0; acc = 0;
    replay = { i: i0, end }; sim = rs; replayTag.hidden = false;
    snapCamera();
  }
  function setCam(c) {
    replayCam = c;
    try { localStorage.setItem('trolley.replayCam', c); } catch (e) { }
    document.querySelectorAll('.cam').forEach(b => b.classList.toggle('on', b.dataset.cam === c));
    if (replay) startReplay(paused ? replay.i : undefined);
  }
  document.querySelectorAll('.cam').forEach(b => (b.onclick = () => setCam(b.dataset.cam)));
  setCam(replayCam);

  // ---------- カメラ ----------
  // default：本番と同じ / onboard：車体の後ろ上に固定した車載 / rails：分岐の先、左右の線路の間の地面すれすれ / top：真上から
  let camFov = 55;
  const railLook = new THREE.Vector3(0, 0.6, 10), topC = new THREE.Vector3(0, 0, -6);
  const RAIL_CAM = new THREE.Vector3();   // ステージごと：作業員の後ろから分岐の方を見る
  const railCamPos = RAIL_CAM.clone();
  const V = new THREE.Vector3();
  function defaultTarget(tPos, tLook) {
    // 洞窟では分岐を過ぎたら後ろから追う（坑道の奥は岩壁で見えないため）
    if (sim && !sim.reason && STAGE.followAfter !== undefined && sim.front.seg !== 'stem' && sim.front.s > STAGE.followAfter) {
      const p = sim.pose, d = p.dir;
      tPos.set(p.x - d.x * 6, 9, p.z - d.z * 6); tLook.set(p.x + d.x * 6, 0.4, p.z + d.z * 6); return 3;
    }
    if (!sim || !sim.reason) {
      const F = sim ? sim.pose.F : PATHS.stem.sample(LS - FIRST_GAP);
      const fz = Math.max(F.z, 6), fx = F.z > 6 ? F.x : 0;   // 曲がった坑道ではトロッコの横位置も追う
      tPos.set(fx, 8, fz + 8.5); tLook.set(fx * 0.6, 0, fz - 13); return 8;
    }
    const p = sim.trolleyBody.position;
    // 洞窟では壁より高い位置から見下ろす（低い位置だと手前の壁で見えなくなる）
    if (STAGE.scenery === 'cave') { tPos.set(p.x * 0.6, 10.5, p.z + 7); tLook.set(p.x, 0.4, p.z - 2); return 2.2; }
    tPos.set(p.x + 6, 3.4, p.z + 8.5); tLook.set(p.x, 0.6, p.z - 1.5); return 2.2;
  }
  function snapCamera() {
    const tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
    defaultTarget(tPos, tLook); camPos.copy(tPos); camLook.copy(tLook);
    RAIL_CAM.set(...STAGE.railCam.pos); railCamPos.copy(RAIL_CAM);
    if (sim) { const p = sim.trolleyBody.position, [bx, bz] = STAGE.railCam.look; railLook.set(bx + (p.x - bx) * 0.55, 0.5, bz + (p.z - bz) * 0.45); topC.set(p.x * 0.5, 0, Math.min(2, p.z * 0.5 - 6)); }
  }
  function updateCamera(mode, dt) {
    camera.up.set(0, 1, 0);
    if (mode === 'onboard' && sim) {
      const b = sim.trolleyBody;
      // 前面のライトの位置。地面にめり込む時だけ高さを持ち上げる
      const p = b.pointToWorldFrame(new CANNON.Vec3(0, 0.15, -2.0)), t = b.pointToWorldFrame(new CANNON.Vec3(0, -0.05, -10));
      const up = b.vectorToWorldFrame(new CANNON.Vec3(0, 1, 0));
      camera.position.set(p.x, Math.max(0.12, p.y), p.z); camera.up.set(up.x, up.y, up.z); camera.lookAt(t.x, t.y, t.z);
      camFov = 76; return b.position;
    }
    if (mode === 'rails' && sim) {
      const p = sim.trolleyBody.position;
      // 作業員が画面に残るよう、分岐の方を基準にしてトロッコを半分だけ追う
      const [bx, bz] = STAGE.railCam.look;
      railLook.lerp(V.set(bx + (p.x - bx) * 0.55, 0.5 + Math.max(0, p.y - 0.65) * 0.5, bz + (p.z - bz) * 0.45), 1 - Math.exp(-dt * 6));
      // 真上を通過する瞬間に向きが裏返らないよう、少しだけ奥へずらして見る
      // 車体がカメラに重なったら、カメラを車体の脇へ弾き出す（車体の中が映らないように）
      const b = sim.trolleyBody, lp = b.pointToLocalFrame(new CANNON.Vec3(RAIL_CAM.x, RAIL_CAM.y, RAIL_CAM.z));
      let want = RAIL_CAM;
      if (Math.abs(lp.x) < 1.0 && Math.abs(lp.y) < 0.9 && Math.abs(lp.z) < 2.2) {
        const w = b.pointToWorldFrame(new CANNON.Vec3((lp.x < 0 ? -1 : 1) * 1.05, lp.y, lp.z));
        want = V.set(w.x, Math.max(0.2, w.y), w.z);
      }
      railCamPos.lerp(want, 1 - Math.exp(-dt * 25));
      camera.position.copy(railCamPos); camera.lookAt(railLook.x, railLook.y, railLook.z + (Math.abs(railLook.z - railCamPos.z) < 0.6 ? 0.6 : 0));
      camFov = 70; return railCamPos;
    }
    if (mode === 'top' && sim) {
      const p = sim.trolleyBody.position;
      topC.lerp(V.set(p.x * 0.5, 0, Math.min(2, p.z * 0.5 - 6)), 1 - Math.exp(-dt * 2));
      camera.up.set(0, 0, -1); camera.position.set(topC.x, 32, topC.z + 0.01); camera.lookAt(topC.x, 0, topC.z);
      camFov = 50; return topC;
    }
    const tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
    const k = defaultTarget(tPos, tLook);
    const f = 1 - Math.exp(-dt * k);
    camPos.lerp(tPos, f); camLook.lerp(tLook, f);
    camera.position.copy(camPos); camera.lookAt(camLook);
    camFov = 55; return camLook;
  }

  // ---------- ループ ----------
  let last = performance.now(), acc = 0, clock = 0;
  function timeScale() {
    if (!sim) return 1;
    if (sim.state === 'rail') {
      const fz = sim.pose.F.z;
      if (fz < 3.0 && (sim.tail.seg === 'stem' || sim.tail.s < TONGUE + 0.3)) return 0.25;
      return 1;
    }
    if (sim.reason) { const t = sim.derailT; return t < 0.5 ? 0.28 : t < 1.2 ? 0.28 + (t - 0.5) / 0.7 * 0.72 : 1; }
    return 1;
  }

  function frame(now) {
    const realDt = Math.min(0.05, (now - last) / 1000); last = now; clock += realDt;
    if (!replay && (keys.ArrowLeft || keys.a)) lever = Math.max(0, lever - realDt * 2.5);
    if (!replay && (keys.ArrowRight || keys.d)) lever = Math.min(1, lever + realDt * 2.5);
    leverFeedback();
    if (!replay && paused) setPaused(false);
    if (pbar.hidden !== !replay) pbar.hidden = !replay;
    // 一時停止中は演出の時間も止める（カメラの寄りだけは動く）
    const fDt = replay && paused ? 0 : realDt;

    if (sim && (running || replay)) {
      if (paused && replay) { if (stepReq > 0) { acc += stepReq * DT; stepReq = 0; } }
      else if (hitStop > 0) hitStop -= realDt; else acc += realDt * timeScale();
      let n = 0;
      while (acc >= DT && n < 30) {
        if (replay) {
          lever = rec[Math.min(replay.i, rec.length - 1)] ?? 0;
          sim.p = lever; sim.step(); replay.i++;
        } else { sim.p = lever; rec.push(lever); sim.step(); }
        acc -= DT; n++;
        if (replay && replay.i >= replay.end) { startReplay(); break; }
      }
      for (const ev of sim.events.splice(0)) {
        if (ev.type === 'clunk') clunk();
        if (ev.type === 'cross') beep(ev.axle === 'front' ? 520 : 400, 0.06, 'triangle', 0.05);
        if (ev.type === 'derail') {
          noise(0.7, 0.5, 900); noise(0.35, 0.25, 5000); shake = 0.75;
          hitStop = 0.09; fovKick = 9; flashT = 1;
          emitSparks(ev.x, 0.2, ev.z, 90, ev.vx, ev.vz, 4, 5);
          emitDebris(ev.x, ev.z, 16, ev.vx, ev.vz);
          emitDust(ev.x, ev.z, 9, 1.6, 1.2);
          reasonEl.textContent = REASON_LABEL[ev.reason]; reasonEl.style.opacity = 1; reasonTimer = 1.6;
        }
        if (ev.type === 'wall') { noise(0.25, 0.4, 500); shake = Math.max(shake, 0.35); }
        if (ev.type === 'wallHit') emitSparks(ev.x, ev.y, ev.z, 40, 0, 0, 4, 3);
        if (ev.type === 'derail2') { noise(0.5, 0.45, 700); shake = Math.max(shake, 0.4); emitSparks(ev.x, 0.2, ev.z, 50, 0, -8, 3, 4); emitDust(ev.x, ev.z, 5, 1.3, 0.8); }
        if (ev.type === 'impact') {
          const k = Math.min(1, ev.v / 6);
          noise(0.25, 0.25 + 0.3 * k, 260); shake = Math.max(shake, 0.15 + 0.3 * k);
          emitDust(ev.x, ev.z, 2 + Math.round(4 * k), 1.0 + k, 0.6); emitSparks(ev.x, ev.y, ev.z, 8 + Math.round(24 * k), 0, 0, 3, 3);
          if (k > 0.6) emitDebris(ev.x, ev.z, 4, 0, 0);
        }
        if (ev.type === 'ballImpact') emitDust(ev.x, ev.z, 1, 0.7, 0.2);
        if (ev.type === 'cross') emitSparks(0, 0.15, 0, 6, 0, -8, 1, 1.5);
        if (ev.type === 'hit') {
          beep(140, 0.18, 'sawtooth', 0.05);
          const pm = personMeshes[ev.i], hel = pm.userData.helmet, L = looseHelmets[ev.i], pb = sim.people[ev.i];
          pm.userData.parts.forEach(m => (m.material = hitMat));
          if (hel) {
            hel.getWorldPosition(L.h.position); hel.visible = false; L.h.visible = true; L.live = true;
            L.v.set(pb.velocity.x * 0.6 + jitter(1.5), 5 + rnd() * 2.5, pb.velocity.z * 0.6 + jitter(1.5)); L.w.set(jitter(12), 0, jitter(12));
          }
          emitDust(pb.position.x, pb.position.z, 2, 0.9, 0.3);
        }
        if (ev.type === 'derail' && !replay) keyStep = rec.length;
        if (ev.type === 'hit' && !replay) lastHitStep = rec.length;
        if (ev.type === 'cross' && ev.axle === 'front' && !replay && crossStep === null) crossStep = rec.length;
        if (ev.type === 'done' && !replay) { doneStep = rec.length; running = false; showResult(); }
      }
      if (sim.state === 'rail' && !replay) {
        const mm = sim.q > BAND_LO && sim.q < BAND_HI;
        alarmT -= realDt; if (mm && alarmT <= 0) { beep(880, 0.08, 'square', 0.03); alarmT = 0.25; }
      }
    } else if (sim) {
      sim.world.step(DT);
    }
    if (reasonTimer > 0) { reasonTimer -= fDt; if (reasonTimer <= 0) reasonEl.style.opacity = 0; }

    // 分岐器：走行中はシミュレーションの値、それ以外はバーに追従する見た目用のバネ
    if (sim && (running || replay) && (sim.state === 'rail' || sim.carsOnRail)) { prevSw.q = sim.q; prevSw.v = sim.qv; }
    else previewSwitch(realDt);
    updateSwitch(prevSw.q, clock);

    // 同期
    if (sim) {
      trolley.position.copy(sim.trolleyBody.position); trolley.quaternion.copy(sim.trolleyBody.quaternion);
      sim.cars.forEach((c, j) => { carMeshes[j].position.copy(c.body.position); carMeshes[j].quaternion.copy(c.body.quaternion); });
      sim.ballPositions().forEach((p, i) => {
        ballMeshes[i].position.set(p.x, p.y, p.z);
        if (p.q) ballMeshes[i].quaternion.copy(p.q);
      });
      sim.people.forEach((b, i) => { personMeshes[i].position.copy(b.position); personMeshes[i].quaternion.copy(b.quaternion); });
      const fxDt = hitStop > 0 || (paused && replay) ? 0 : realDt * timeScale();
      if (sim.reason && sim.state === 'derailed') slideSparks(fxDt);
      updateFX(fxDt);
    } else {
      const nb = STAGE.balls.length;
      [trolley, ...carMeshes].forEach((mesh, j) => {
        const P = PATHS.stem.sample(LS - FIRST_GAP - WHEELBASE / 2 - j * (WHEELBASE + CAR_GAP)), yaw = Math.atan2(-P.tx, -P.tz), c = Math.cos(yaw), sn = Math.sin(yaw);
        mesh.position.set(P.x, BODY_Y, P.z); mesh.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0));
        STAGE.balls.forEach(([lx, ly, lz], i) => ballMeshes[j * nb + i].position.set(P.x + lx * c + lz * sn, BODY_Y + BODY_HALF[1] + BALL_R + ly, P.z - lx * sn + lz * c));
      });
      STAGE.people.forEach((pp, i) => personMeshes[i].position.set(pp.x, pp.kind ? ANIMAL[pp.kind].half[1] : 0.85, pp.z));
    }

    // カメラ
    const mode = replay ? replayCam : 'default';
    { const show = mode !== 'rails'; if (pillarMeshes.length && pillarMeshes[0].visible !== show) pillarMeshes.forEach(m => (m.visible = show)); }
    const focus = updateCamera(mode, realDt);
    if (shake > 0 && fDt > 0) { shake = Math.max(0, shake - realDt); camera.position.x += (Math.random() - 0.5) * shake * 0.6; camera.position.y += (Math.random() - 0.5) * shake * 0.6; }
    fovKick *= Math.exp(-fDt * 5);
    const fov = camFov - fovKick;
    // 車載で坑口を越えたら暗転し、そのまま真っ暗
    let dark = 0;
    if (mode === 'onboard' && sim && STAGE.portalZ !== undefined) {
      const depth = STAGE.portalZ - camera.position.z;
      if (depth > 0 && Math.abs(Math.abs(camera.position.x) - (STAGE.portalX ?? 3.2)) < 1.6 && camera.position.y < 3.4) dark = Math.min(1, depth / 1.2);
    }
    tunnelEl.style.opacity = dark.toFixed(3);
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
    if (flashT > 0) { flashT = Math.max(0, flashT - fDt * 5); flashEl.style.opacity = (flashT * 0.7).toFixed(3); }
    sun.position.set(focus.x - 14, 12, focus.z + 9); sun.target.position.set(focus.x, 0, focus.z);
    updateSnow(fDt, camera.position.x, camera.position.z - 12);

    renderer.render(scene, camera);
    drawBoard(clock);
    drawLever();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // テスト用
  window.__game = { get sim() { return sim; }, get replay() { return replay; }, setLever(v) { lever = v; }, encodeRec, setPaused, get paused() { return paused; }, start() { document.getElementById('startBtn').click(); }, setCam };
}
</script>
</body>
