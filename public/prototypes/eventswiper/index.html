<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Import Lab</title>
    <link rel="stylesheet" href="./src/styles.css?v=20260609-sample-safe" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workbench" aria-label="Event import lab">
        <header class="topbar">
          <div>
            <p class="eyebrow">Event Import Lab</p>
            <h1>Grok出力をカード雛形にする</h1>
          </div>
          <div class="topbar-actions">
            <button class="ghost-button is-active" id="importViewButton" type="button">Import</button>
            <button class="ghost-button" id="savedViewButton" type="button">カードビュー <span id="savedCount">0</span></button>
            <button class="ghost-button" id="sampleButton" type="button">サンプル</button>
            <button class="ghost-button" id="clearButton" type="button">クリア</button>
          </div>
        </header>

        <div class="toast" id="toast" role="status" hidden></div>

        <div class="workspace" id="importView">
          <section class="input-pane" aria-labelledby="inputTitle">
            <div class="pane-head">
              <h2 id="inputTitle">貼り付け</h2>
              <span class="hint">JSON配列のみ推奨。コードブロックも一応読めます。</span>
            </div>
            <textarea
              id="importText"
              spellcheck="false"
              placeholder='[
  {
    "title": "サンプルイベントA",
    "date_text": "2026年7月11日（土）",
    "time_text": "18:00-22:00",
    "place_text": "架空会場A",
    "area": "サンプル市",
    "price_text": "3000円",
    "description": "サンプル用の交流イベントです。実在のイベントではありません。",
    "source_tweet_url": "https://x.com/example_event/status/1000000000000000001",
    "detail_url": null,
    "confidence": 0.82,
    "notes": null
  }
]'
            ></textarea>
            <div class="input-actions">
              <button class="primary-button" id="parseButton" type="button">カード化</button>
              <button class="primary-button" id="saveAndViewButton" type="button" disabled>保存してカードビュー</button>
              <button class="secondary-button" id="copyJsonButton" type="button" disabled>JSONコピー</button>
              <button class="secondary-button" id="downloadCsvButton" type="button" disabled>CSV保存</button>
            </div>
            <p class="error-message" id="errorMessage" role="alert" hidden></p>
          </section>

          <section class="result-pane" aria-labelledby="resultTitle">
            <div class="pane-head">
              <h2 id="resultTitle">検証サマリー</h2>
              <span class="hint" id="lastParsed">未パース</span>
            </div>

            <div class="summary-grid" id="summaryGrid" aria-live="polite">
              <article class="summary-tile">
                <span class="summary-value">0</span>
                <span class="summary-label">総件数</span>
              </article>
              <article class="summary-tile warn">
                <span class="summary-value">0</span>
                <span class="summary-label">URLなし</span>
              </article>
              <article class="summary-tile warn">
                <span class="summary-value">0</span>
                <span class="summary-label">日付なし</span>
              </article>
              <article class="summary-tile warn">
                <span class="summary-value">0</span>
                <span class="summary-label">場所なし</span>
              </article>
            </div>

            <div class="issue-list" id="issueList" aria-live="polite"></div>

            <div class="card-list-head">
              <h2>カード雛形</h2>
              <span class="hint">保存前の一時プレビューです。</span>
            </div>
            <div class="card-list" id="cardList">
              <div class="empty-state">
                <p>GrokのJSON配列を貼って「カード化」を押すと、ここにプレビューが出ます。</p>
              </div>
            </div>
          </section>
        </div>

        <section class="saved-view" id="savedView" aria-labelledby="savedTitle" hidden>
          <div class="saved-toolbar">
            <div>
              <p class="eyebrow">Saved Cards</p>
              <h2 id="savedTitle">保存済みカード</h2>
            </div>
            <div class="topbar-actions">
              <button class="secondary-button" id="backToImportButton" type="button">Importへ戻る</button>
              <button class="secondary-button danger-button" id="clearSavedButton" type="button" disabled>保存カードをクリア</button>
            </div>
          </div>
          <div class="saved-stats" id="savedStats"></div>
          <div class="card-list saved-card-list" id="savedCardList">
            <div class="empty-state">
              <p>まだ保存済みカードはありません。</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/app.js?v=20260609-sample-safe"></script>
  </body>
</html>
